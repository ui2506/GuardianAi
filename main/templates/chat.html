{% extends 'base.html' %}

{% load static %}

{% block title %}Чат с ботом{% endblock %}

{% block content %}
<div class="chat-container">
    <div class="chat-window" id="chat-window">

    </div>

    <div class="chat-input">
        <input type="text" id="user-input" placeholder="Введите сообщение..." />
        <button id="send-btn">Отправить</button>
    </div>
</div>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: #f4f6f9;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    .chat-container {
        display: flex;
        flex-direction: column;
        flex: 1;
        max-width: 800px;
        margin: 20px auto;
        border: 1px solid #ddd;
        background: white;
        height: 80vh;
    }

    .chat-window {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
    }

    .message {
        margin: 10px 0;
        padding: 12px 16px;
        border-radius: 8px;
        max-width: 70%;
        line-height: 1.4;
        word-wrap: break-word;
    }

    .message.user {
        background: #007bff;
        color: white;
        margin-left: auto;
    }

    .message.bot {
        background: #e9ecef;
        color: #333;
        margin-right: auto;
    }

    .message.error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
        margin: 10px auto;
        text-align: center;
        width: 100%;
    }

    .loading {
        display: inline-block;
    }

    .loading span {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin: 0 2px;
        background: #555;
        border-radius: 50%;
        animation: bounce 1.4s infinite;
    }
    .loading span:nth-child(2) { animation-delay: 0.2s; }
    .loading span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.6; }
        40% { transform: scale(1); opacity: 1; }
    }

    .chat-input {
        display: flex;
        border-top: 1px solid #ddd;
    }

    .chat-input input {
        flex: 1;
        border: none;
        padding: 15px;
        font-size: 16px;
        outline: none;
    }

    .chat-input button {
        background: #007bff;
        color: white;
        border: none;
        padding: 0 20px;
        cursor: pointer;
        transition: background 0.3s;
    }

    .chat-input button:hover {
        background: #0056b3;
    }
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const chatWindow = document.getElementById("chat-window");
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    function appendMessage(text, sender="bot", isHTML=false) {
        const div = document.createElement("div");
        div.classList.add("message", sender);
        if (isHTML) {
            div.innerHTML = text;
        } else {
            div.textContent = text;
        }
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        return div;
    }

    async function sendMessage() {
        const text = input.value.trim();

        if (!text) return;

        appendMessage(text, "user");
        input.value = "";

        const loadingDiv = appendMessage(
            `<div class="loading"><span></span><span></span><span></span></div>`,
            "bot",
            true
        );

        try {
            const response = await fetch("/api/send/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken")
                },
                body: JSON.stringify({ message: text })
            });

            if (!response.ok) {
                throw new Error(`Ошибка ${response.status}`);
            }

            const data = await response.json();

            loadingDiv.remove();
            appendMessage(data.reply || "Нет ответа", "bot");

        } catch (err) {
            loadingDiv.remove();
            appendMessage(
                `Сервер не отвечает. ${err.message || ""}`,
                "error"
            );
        }
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keypress", e => {
        if (e.key === "Enter") sendMessage();
    });

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== "") {
            const cookies = document.cookie.split(";");
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.startsWith(name + "=")) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
});
</script>
{% endblock %}
